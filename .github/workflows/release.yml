name: NextLead App bauen
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm install --no-save electron@32 electron-builder
      - run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
      - name: Bauen (noch nicht veroeffentlichen)
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          # ACHTUNG: muss zu build.directories.output in package.json passen ("release").
          # Bis 2026-08-12 stand hier "dist/" — das ist das TypeScript-Ziel, nicht das der Installer.
          # Der Workflow lief seit v0.8.0-beta.1 nicht mehr, deshalb fiel es nie auf; mit
          # if-no-files-found:error wäre jeder Release-Lauf hier abgebrochen.
          path: |
            release/*.dmg
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installer
      # Fix "Not Found" beim Asset-Update: lag fuer diesen Tag schon ein (Draft-)Release (Lauf lief
      # doppelt / alter Draft), scheiterte softprops beim Ersetzen der Assets. Daher zuerst ein evtl.
      # bestehendes Release fuer den Tag entfernen (Git-Tag bleibt), dann sauber neu anlegen.
      - name: Bestehendes Release fuer diesen Tag entfernen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Direkt veroeffentlichen statt Entwurf: Ein Entwurf ist nur eingeloggt sichtbar und
          # `releases/latest` findet ihn nicht — damit greifen weder die Download-Links der
          # Landing-Page noch der eingebaute Update-Check.
          draft: false
          prerelease: true
          files: installer/**/*
